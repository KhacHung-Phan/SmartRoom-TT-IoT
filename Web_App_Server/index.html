
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmartRoom IoT</title>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartRoom">

</head>
<body>
  <script>
    // redirect theo session (demo)
    try{
      const sess = JSON.parse(localStorage.getItem("iot_session") || "null");
      location.href = sess?.userId ? "dashboard.html" : "login.html";
    }catch(e){
      location.href = "login.html";
    }
  </script>
  <noscript>Hãy bật JavaScript để chạy dashboard.</noscript>
</body>
</html>
